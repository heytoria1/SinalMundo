<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SinalMundo</title>
<style>
:root{
--verde:#6B8E23;
--verde-escuro:#315D36;
--verde-claro:#EEF5DF;
--fundo:#F5F8F1;
--branco:#FFF;
--cinza:#66757F;
--borda:#AFC19F
}
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,sans-serif;
background:var(--fundo);
color:var(--verde-escuro)
}
button,input{font-family:inherit}
#app{min-height:100vh}
.tela{
min-height:100vh;
padding:20px 14px;
display:flex;
justify-content:center;
align-items:center
}
.card{
width:100%;
max-width:500px;
background:#fff;
border-radius:32px;
padding:30px 24px;
text-align:center;
box-shadow:0 12px 40px rgba(49,93,54,.12);
position:relative;
overflow:hidden
}
.card:before,.card:after{
content:"";
position:absolute;
width:180px;
height:180px;
background:#E7F0D8;
border-radius:50%;
opacity:.7
}
.card:before{left:-100px;top:120px}
.card:after{right:-100px;bottom:20px}
.conteudo{position:relative;z-index:2}
.foto{
width:125px;
height:125px;
object-fit:cover;
border-radius:50%;
border:4px solid var(--verde);
display:block;
margin:0 auto 18px
}
h1{
font-size:34px;
color:var(--verde-escuro);
margin-bottom:15px
}
h2{
font-size:27px;
margin-bottom:15px
}
.frase{
font-size:18px;
line-height:1.5;
margin-bottom:22px
}
.logo{
font-size:38px;
font-weight:bold;
color:var(--verde);
margin-bottom:8px
}
.sublogo{
font-size:18px;
margin-bottom:20px
}
.divisor{
color:var(--verde);
font-size:24px;
margin-bottom:15px
}

input{
width:100%;
padding:17px;
margin-bottom:14px;
border:2px solid var(--borda);
border-radius:18px;
font-size:16px;
outline:none
}
input:focus{
border-color:var(--verde)
}
button{
width:100%;
padding:17px;
margin-top:7px;
border-radius:18px;
font-size:17px;
font-weight:bold;
cursor:pointer
}
.btn-verde{
border:0;
background:var(--verde);
color:#fff
}
.btn-claro{
border:0;
background:var(--verde-claro);
color:var(--verde-escuro)
}
.btn-branco{
background:#fff;
color:var(--verde-escuro);
border:2px solid var(--verde)
}
.mensagem{
margin-top:15px;
font-size:16px;
line-height:1.5
}
.final{
margin-top:28px;
font-size:18px;
line-height:1.5
}
.menu{
display:grid;
gap:10px;
margin-top:20px
}
.item{
padding:18px;
border-radius:20px;
background:var(--verde-claro);
color:var(--verde-escuro);
font-size:17px;
font-weight:bold;
border:0
}
.resultado{
margin-top:20px;
padding:18px;
border-radius:20px;
background:var(--verde-claro);
font-size:17px;
line-height:1.5
}
.lista{
display:grid;
gap:12px;
margin-top:20px
}
.idioma{
padding:18px;
background:var(--verde-claro);
border:2px solid transparent;
border-radius:20px;
text-align:left
}
.idioma strong{
display:block;
font-size:19px;
margin-bottom:5px
}
.idioma span{
color:var(--cinza)
}
.sinal{
padding:18px;
background:#fff;
border:2px solid var(--borda);
border-radius:20px;
margin-top:12px
}
.sinal strong{
color:var(--verde);
font-size:20px
}
.vazio{
margin-top:20px;
color:var(--cinza);
line-height:1.5
}
.avatar-atual{
font-size:80px;
margin:15px 0
}

</style>
</head>
<body>

<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL="https://pvafjvxdajinoxedmlsj.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_-n0hHo22n29h5Nlo-rTeHg_-dQbntHj";

const supabaseClient=window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);

const PIX_PREMIUM="vicky.araujo.silva20@gmail.com";

const AVATARES=[
"🌸","🌻","🌺","🌷","🦋","🐱","🐶","🐼",
"🐨","🐰","🦄","🌈","⭐","💚","🤟🏻"
];

const CORES={
verde:"#6B8E23",
azul:"#4682B4",
amarelo:"#DAA520"
};

function carregarCor(){
const cor=localStorage.getItem("sinalMundoCor")||"verde";
document.documentElement.style.setProperty(
"--verde",
CORES[cor]||CORES.verde
);
}

function mostrarLogin(){
document.getElementById("app").innerHTML=`
<div class="tela">
<div class="card">
<div class="conteudo">

<img src="angela-vytorya-sinalmundo-1.jpg" class="foto" alt="Foto">

<div class="logo">🌎 SinalMundo</div>

<h1>Bem-vindo(a)!</h1>

<p class="frase">
Aqui, cada sinal é uma ponte para um mundo mais conectado! 🤟🏻
</p>

<p class="frase">
Entre na sua conta para continuar.
</p>

<input id="email" type="email" placeholder="Seu e-mail">
<input id="senha" type="password" placeholder="Sua senha">

<button class="btn-verde" onclick="entrar()">➜ Entrar</button>
<button class="btn-claro" onclick="criarConta()">Criar conta</button>
<button class="btn-branco" onclick="recuperarSenha()">Esqueci minha senha</button>

<p id="mensagem" class="mensagem"></p>

<p class="final">
Juntos por um mundo mais inclusivo! ♡
</p>

</div>
</div>
</div>`;
}

async function entrar(){
const email=document.getElementById("email").value.trim();
const senha=document.getElementById("senha").value;

if(!email||!senha){
document.getElementById("mensagem").innerText="Preencha seu e-mail e sua senha.";
return;
}

const {error}=await supabaseClient.auth.signInWithPassword({
email,
password:senha
});

if(error){
document.getElementById("mensagem").innerText=error.message;
return;
}

mostrarInicio();
}

async function criarConta(){
const email=document.getElementById("email").value.trim();
const senha=document.getElementById("senha").value;
const mensagem=document.getElementById("mensagem");

if(!email||!senha){
mensagem.innerText="Preencha seu e-mail e sua senha.";
return;
}

if(senha.length<6){
mensagem.innerText="A senha precisa ter pelo menos 6 caracteres.";
return;
}

const {data,error}=await supabaseClient.auth.signUp({
email,
password:senha
});

if(error){
mensagem.innerText=error.message;
return;
}

if(data.user){
await supabaseClient.from("perfis").upsert({
id:data.user.id,
avatar:"🌸"
});
}

mensagem.innerText=
"Conta criada! Verifique seu e-mail para confirmar o cadastro. 💚";
}

async function recuperarSenha(){
const email=document.getElementById("email").value.trim();
const mensagem=document.getElementById("mensagem");

if(!email){
mensagem.innerText="Digite seu e-mail primeiro.";
return;
}

const {error}=await supabaseClient.auth.resetPasswordForEmail(
email,
{
redirectTo:window.location.origin
}
);

if(error){
mensagem.innerText=error.message;
return;
}

mensagem.innerText=
"Enviamos um link para redefinir sua senha. 💚";
}

function mostrarInicio(){
document.getElementById("app").innerHTML=`
<div class="tela">
<div class="card">
<div class="conteudo">

<div class="logo">🌎 SinalMundo</div>

<h2>Olá! 👋🏻</h2>

<p class="frase">
Línguas de sinais aproximam pessoas ♡
</p>

<div class="menu">

<button class="item" onclick="mostrarPesquisa()">🔎 Pesquisa</button>

<button class="item" onclick="mostrarIdiomas()">🌎 Idiomas</button>

<button class="item" onclick="mostrarFavoritos()">❤️ Favoritos</button>

<button class="item" onclick="mostrarPerfil()">👤 Meu perfil</button>

<button class="item" onclick="mostrarPremium()">💚 Premium</button>

<button class="item" onclick="sair()">🚪 Sair</button>

</div>

</div>
</div>
</div>`;
}

function mostrarPesquisa(){
document.getElementById("app").innerHTML=`
<div class="tela">
<div class="card">
<div class="conteudo">

<div class="logo">🔎 Pesquisa</div>

<input id="busca" placeholder="Digite um sinal...">

<button class="btn-verde" onclick="buscarSinal()">Pesquisar</button>

<div id="resultado"></div>

<button class="btn-claro" onclick="mostrarInicio()">← Voltar</button>

</div>
</div>
</div>`;
}

function buscarSinal(){
const termo=document.getElementById("busca").value.trim();

if(!termo){
document.getElementById("resultado").innerHTML=
`<p class="vazio">Digite um sinal para pesquisar. 💚</p>`;
return;
}

document.getElementById("resultado").innerHTML=`
<div class="resultado">
<strong>${termo}</strong>
<p>
Em breve você poderá encontrar sinais, imagens e vídeos relacionados.
</p>
</div>`;
}

function mostrarIdiomas(){
document.getElementById("app").innerHTML=`
<div class="tela">
<div class="card">
<div class="conteudo">

<div class="logo">🌎 Idiomas</div>

<div class="lista">

<button class="idioma">
<strong>🇧🇷 Libras</strong>
<span>Língua Brasileira de Sinais</span>
</button>

<button class="idioma">
<strong>🇺🇸 ASL</strong>
<span>American Sign Language</span>
</button>

<button class="idioma">
<strong>🇬🇧 BSL</strong>
<span>British Sign Language</span>
</button>

<button class="idioma">
<strong>🇫🇷 LSF</strong>
<span>Langue des Signes Française</span>
</button>

</div>

<button class="btn-claro" onclick="mostrarInicio()">← Voltar</button>

</div>
</div>
</div>`;
}

async function mostrarFavoritos(){
const {data:{user}}=await supabaseClient.auth.getUser();

if(!user){
mostrarLogin();
return;
}

document.getElementById("app").innerHTML=`
<div class="tela">
<div class="card">
<div class="conteudo">

<div class="logo">❤️ Favoritos</div>

<p class="vazio">
Você ainda não adicionou sinais aos favoritos.
</p>

<button class="btn-claro" onclick="mostrarInicio()">← Voltar</button>

</div>
</div>
</div>`;
}

async function mostrarPerfil(){
const {data:{user}}=await supabaseClient.auth.getUser();

if(!user){
mostrarLogin();
return;
}

const {data}=await supabaseClient
.from("perfis")
.select("avatar")
.eq("id",user.id)
.maybeSingle();

const avatar=data?.avatar||"🌸";

document.getElementById("app").innerHTML=`
<div class="tela">
<div class="card">
<div class="conteudo">

<div class="logo">👤 Meu perfil</div>

<div class="avatar-atual">${avatar}</div>

<p class="frase">Escolha seu avatar:</p>

<div class="lista">
${AVATARES.map(a=>`
<button class="idioma" onclick="salvarAvatar('${a}')">
<span style="font-size:35px">${a}</span>
</button>
`).join("")}
</div>

<p class="frase">Escolha uma cor:</p>

<div class="lista">

<button class="item" onclick="salvarCor('verde')">
💚 Verde
</button>

<button class="item" onclick="salvarCor('azul')">
💙 Azul
</button>

<button class="item" onclick="salvarCor('amarelo')">
💛 Amarelo
</button>

</div>

<p id="perfilMensagem" class="mensagem"></p>

<button class="btn-claro" onclick="mostrarInicio()">← Voltar</button>

</div>
</div>
</div>`;
}

async function salvarAvatar(avatar){
const {data:{user}}=await supabaseClient.auth.getUser();

if(!user)return;

const {error}=await supabaseClient
.from("perfis")
.upsert({
id:user.id,
avatar:avatar
});

const mensagem=document.getElementById("perfilMensagem");

if(error){
mensagem.innerText="Não foi possível salvar o avatar.";
return;
}

mensagem.innerText="Avatar salvo! 💚";
mostrarPerfil();
}

function salvarCor(cor){
localStorage.setItem("sinalMundoCor",cor);
carregarCor();

const mensagem=document.getElementById("perfilMensagem");

if(mensagem){
mensagem.innerText="Cor salva! 💚";
}

mostrarPerfil();
}

function mostrarPremium(){
document.getElementById("app").innerHTML=`
<div class="tela">
<div class="card">
<div class="conteudo">

<div class="logo">🌎 SinalMundo</div>

<h2>💚 Premium</h2>

<p class="frase">
Tenha acesso vitalício aos recursos Premium do SinalMundo.
</p>

<div class="preco">
R$ 50,00<br>
<span style="font-size:16px">
pagamento único • vitalício
</span>
</div>

<div class="premium-box">
<h3>✨ Benefícios Premium</h3>

<ul class="premium-lista">
<li>Acesso a mais línguas de sinais</li>
<li>Pesquisa completa de sinais</li>
<li>Meus favoritos</li>
<li>Biblioteca de conteúdos</li>
<li>Vídeos exclusivos</li>
<li>Quizzes e exercícios</li>
<li>Comparação entre línguas</li>
<li>Desafios e conquistas</li>
<li>Novidades antecipadas</li>
<li>Grupo exclusivo Premium</li>
<li>Suporte prioritário</li>
</ul>
</div>

<div class="premium-box">
<h3>💳 Pagamento por Pix</h3>

<p>
Copie a chave Pix abaixo e faça o pagamento de R$ 50,00.
</p>

<div class="pix">
<strong>Chave Pix:</strong><br>
${PIX_PREMIUM}
</div>

<button id="copiarPix" class="btn-verde">
📋 Copiar chave Pix
</button>

<button id="comprovanteBtn" class="btn-claro">
📸 Enviar comprovante
</button>

<div class="aviso">
Após o pagamento, envie o comprovante para a administração do SinalMundo para conferência e ativação do Premium. A aprovação ainda é manual nesta versão.
</div>

</div>

<p id="premiumMensagem" class="mensagem"></p>

<button id="voltarPremium" class="btn-claro">
← Voltar
</button>

</div>
</div>
</div>`;

document.getElementById("copiarPix").onclick=async()=>{
try{
await navigator.clipboard.writeText(PIX_PREMIUM);
document.getElementById("premiumMensagem").innerText=
"Chave Pix copiada! 💚";
}catch(e){
document.getElementById("premiumMensagem").innerText=
"Selecione e copie a chave Pix manualmente.";
}
};

document.getElementById("comprovanteBtn").onclick=()=>{
document.getElementById("premiumMensagem").innerText=
"Envie o comprovante pelo canal de atendimento do SinalMundo. 💚";
};

document.getElementById("voltarPremium").onclick=mostrarInicio;
}

async function sair(){
await supabaseClient.auth.signOut();
mostrarLogin();
}

async function verificarSessao(){
const{data}=await supabaseClient.auth.getSession();

if(data.session){
mostrarInicio();
}else{
mostrarLogin();
}
}

carregarCor();
verificarSessao();

</script>
</body>
</html>
