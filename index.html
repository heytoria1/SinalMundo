<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SinalMundo</title>
    <style>
        :root {
            --azul-principal: #0b57d0;
            --azul-claro: #e8f0fe;
            --roxo: #7c3aed;
            --verde: #10b981;
            --cinza-fundo: #f0f4f9;
            --texto-escuro: #1e293b;
            --card-bg: white;
            --border-color: #e2e8f0;
        }

        .dark-theme {
            --azul-principal: #3b82f6;
            --azul-claro: #1e3a8a;
            --roxo: #a78bfa;
            --verde: #34d399;
            --cinza-fundo: #0f172a;
            --texto-escuro: #f8fafc;
            --card-bg: #1e293b;
            --border-color: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--cinza-fundo);
            color: var(--texto-escuro);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }

        /* 1. TELA DE ABERTURA IGUAL À FOTO (SEM CARREGANDO) */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        /* Container do Logo Redondo Grande */
        .splash-logo-container {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
        }

        /* O Planeta Terra Realista com continentes em CSS */
        .splash-logo-planet {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: #2563eb; /* Oceano Azul */
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(11, 87, 208, 0.25);
            border: 4px solid #ffffff;
        }

        /* Continentes desenhados em CSS para simular o mapa da foto */
        .splash-logo-planet::before {
            content: "";
            position: absolute;
            width: 90px; height: 110px;
            background: #22c55e; /* Continente Verde 1 */
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            top: 10px; left: 15px;
        }

        .splash-logo-planet::after {
            content: "";
            position: absolute;
            width: 80px; height: 90px;
            background: #22c55e; /* Continente Verde 2 */
            border-radius: 60% 40% 30% 70% / 50% 60% 40% 60%;
            bottom: 15px; right: 10px;
        }

        /* Mão Realista de Traço (Desenhada perfeitamente por cima do planeta) */
        .splash-hand-vector {
            position: absolute;
            width: 110px;
            height: 110px;
            z-index: 10;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><path d='M10 18v-3a2 2 0 0 1 4 0v3M6 14a2 2 0 0 1 2-2M18 10a2 2 0 0 0-2-2h-1M6 14v4a4 4 0 0 0 4 4h4a4 4 0 0 0 4-4v-8'/><path d='M6 14c0-2.5 1.5-4.5 4-4.5s3.5 1 3.5 3.5M18 10V5a2 2 0 0 0-4 0v5M6 14V8a2 2 0 0 1 4 0v4'/></svg>");
            background-size: contain;
            background-repeat: no-repeat;
            filter: drop-shadow(0px 6px 10px rgba(0, 0, 0, 0.3));
        }

        /* Corações decorativos da logo ao lado do planeta */
        .splash-heart-1 {
            position: absolute;
            top: 35px; right: 25px;
            font-size: 1.8rem;
            color: #0b57d0;
            transform: rotate(15deg);
        }

        .splash-heart-2 {
            position: absolute;
            bottom: 30px; right: 5px;
            font-size: 1.5rem;
            color: #0b57d0;
            transform: rotate(-10deg);
        }

        /* Tipografia oficial do logo */
        .splash-title {
            color: #0d47a1;
            font-weight: 800;
            font-size: 2.5rem;
            letter-spacing: -0.8px;
            margin-bottom: 8px;
        }

        .splash-subtitle {
            color: #1e293b;
            font-size: 1rem;
            font-weight: 500;
            text-align: center;
            max-width: 250px;
            line-height: 1.4;
            opacity: 0.9;
        }

        /* 2. AUTENTICAÇÃO */
        #auth-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--cinza-fundo);
            display: none;
            flex-direction: column;
            justify-content: center;
            padding: 24px;
            z-index: 150;
        }

        .auth-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 28px 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            border: 1px solid var(--border-color);
        }

        .auth-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--azul-principal);
            margin-bottom: 6px;
            text-align: center;
        }

        .form-group { margin-bottom: 16px; }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--texto-escuro);
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            background-color: var(--cinza-fundo);
            color: var(--texto-escuro);
        }

        /* 3. INTERFACE PRINCIPAL */
        #app-layout {
            display: none;
            flex-direction: column;
            height: 100vh;
        }

        .app-header {
            background-color: var(--card-bg);
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
        }

        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .brand-title { font-size: 1.4rem; font-weight: 800; color: var(--azul-principal); }

        .btn-premium-top {
            background: linear-gradient(135deg, var(--roxo), var(--azul-principal));
            color: white; border: none; padding: 6px 12px; border-radius: 20px;
            font-size: 0.75rem; font-weight: 700; cursor: pointer;
        }

        .search-container { position: relative; width: 100%; }
        .search-input {
            width: 100%; padding: 10px 16px 10px 40px;
            border: 1px solid var(--border-color); border-radius: 24px;
            background-color: var(--cinza-fundo); color: var(--texto-escuro);
            font-size: 0.95rem; outline: none;
        }

        .app-container { flex: 1; overflow-y: auto; padding-bottom: 80px; }
        .app-page { display: none; padding: 16px; }
        .app-page.active { display: block; }

        .premium-banner {
            background: linear-gradient(135deg, #1e3a8a, var(--roxo));
            color: white; padding: 16px; border-radius: 16px; margin-bottom: 20px; cursor: pointer;
        }

        .category-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
        
        .category-card {
            background: var(--card-bg); border-radius: 16px; padding: 14px;
            text-align: center; font-size: 0.8rem; font-weight: 700;
            border: 1px solid var(--border-color); cursor: pointer;
        }

        .cat-icon-box {
            width: 45px; height: 45px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 8px; font-size: 1.4rem;
        }

        .video-card { background: var(--card-bg); border-radius: 16px; overflow: hidden; border: 1px solid var(--border-color); margin-bottom: 14px; }
        
        .video-thumb {
            width: 100%; height: 160px; background-color: #1e293b;
            display: flex; justify-content: center; align-items: center;
            color: white; font-size: 2.5rem; position: relative;
        }

        .play-overlay {
            background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(4px);
            border-radius: 50%; width: 55px; height: 55px;
            display: flex; justify-content: center; align-items: center;
            border: 2px solid white; cursor: pointer;
        }

        .compare-split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
        .compare-box { background: var(--card-bg); border-radius: 14px; padding: 12px; text-align: center; border: 1px solid var(--border-color); }

        .toggle-switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--azul-principal); }
    </style>
    
    <!-- Vercel Speed Insights -->
    <script>
        window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</head>

</body>
</html>
