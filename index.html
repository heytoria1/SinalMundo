<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SinalMundo</title>
<style>
:root{--verde:#6B8E23;--escuro:#315D36;--claro:#EEF5DF;--fundo:#F5F8F1;--branco:#fff;--cinza:#66757F;--borda:#AFC19F}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:var(--fundo);color:var(--escuro)}
button,input{font-family:inherit}
#app{min-height:100vh}
.tela{min-height:100vh;padding:18px 12px;display:flex;justify-content:center;align-items:center}
.card{width:100%;max-width:520px;background:var(--branco);border-radius:30px;padding:28px 22px;text-align:center;box-shadow:0 12px 40px rgba(49,93,54,.12);position:relative;overflow:hidden}
.card:before,.card:after{content:"";position:absolute;width:190px;height:190px;background:var(--claro);border-radius:50%;opacity:.8}
.card:before{left:-110px;top:100px}.card:after{right:-110px;bottom:-30px}
.conteudo{position:relative;z-index:2}
.folha{position:absolute;font-size:50px;line-height:1;z-index:1;opacity:.9}
.f1{left:18px;top:12px}.f2{right:18px;top:24px}.f3{left:18px;bottom:18px}.f4{right:18px;bottom:15px}
.foto{width:125px;height:125px;object-fit:cover;border-radius:50%;border:4px solid var(--verde);display:block;margin:5px auto 18px}
.logo{font-size:38px;font-weight:bold;color:var(--verde);margin-bottom:7px}
.sublogo{font-size:18px;margin-bottom:18px}
.divisor{color:var(--verde);font-size:23px;margin-bottom:14px}
h1{font-size:34px;color:var(--escuro);margin-bottom:14px}h2{font-size:27px;margin-bottom:14px}
.frase{font-size:18px;line-height:1.5;margin-bottom:20px}
input{width:100%;padding:17px 18px;margin-bottom:13px;border:2px solid var(--borda);border-radius:18px;font-size:16px;outline:none}
input:focus{border-color:var(--verde)}
button{width:100%;padding:16px;margin-top:7px;border-radius:18px;font-size:17px;font-weight:bold;cursor:pointer}
.btn-verde{border:0;background:var(--verde);color:#fff}.btn-claro{border:0;background:var(--claro);color:var(--escuro)}
.btn-branco{background:#fff;color:var(--escuro);border:2px solid var(--verde)}
.mensagem{margin-top:14px;font-size:16px;line-height:1.5}.final{margin-top:25px;font-size:18px;line-height:1.5}
.menu{display:grid;gap:10px;margin-top:18px}.item{padding:17px;border-radius:20px;background:var(--claro);color:var(--escuro);border:0}
.resultado{margin-top:18px;padding:18px;border-radius:20px;background:var(--claro);font-size:17px;line-height:1.5}
.lista{display:grid;gap:11px;margin-top:18px}.idioma{padding:17px;background:var(--claro);border-radius:19px;text-align:left}
.idioma strong{display:block;font-size:19px;margin-bottom:5px}.idioma span{color:var(--cinza)}
.sinal{padding:17px;background:#fff;border:2px solid var(--borda);border-radius:19px;margin-top:10px}.sinal strong{color:var(--verde);font-size:20px}
.vazio{margin-top:18px;color:var(--cinza);line-height:1.5}
.avatar-grid,.cor-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.avatar,.cor{border:2px solid var(--borda);background:#fff;border-radius:18px;padding:12px;font-size:30px}
.avatar.selecionado,.cor.selecionado{border-color:var(--verde);box-shadow:0 0 0 3px var(--claro)}
.cor{height:55px;font-size:0}.cor-oliva{background:#6B8E23}.cor-azul{background:#2F6FA3}.cor-amarela{background:#D9B300}.cor-rosa{background:#C56A8A}.cor-roxa{background:#8064A2}.cor-terracota{background:#B65C3A}
.premium{border:2px solid var(--verde);background:linear-gradient(180deg,var(--claro),#fff);padding:20px;border-radius:22px;margin-top:15px;text-align:left}
.premium li{margin:10px 0;list-style:none}.premium h3{font-size:24px;margin-bottom:8px;color:var(--verde)}
.pequeno{font-size:14px;color:var(--cinza);margin-top:10px}
@media(max-width:380px){.logo{font-size:32px}.avatar-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://pvafjvxdajinoxedmlsj.supabase.co";
const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_-n0hHo22n29h5Nlo-rTeHg_-dQbntHj"; supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const sinais=[
{palavra:"amor",idioma:"Libras",descricao:"Sinal de amor em Libras."},
{palavra:"oi",idioma:"Libras",descricao:"Sinal de cumprimento em Libras."},
{palavra:"obrigado",idioma:"Libras",descricao:"Sinal de agradecimento em Libras."},
{palavra:"família",idioma:"Libras",descricao:"Sinal relacionado à família."},
{palavra:"amizade",idioma:"Libras",descricao:"Sinal relacionado à amizade."}
];

const temas={
oliva:{nome:"Oliva",cor:"#6B8E23",escuro:"#315D36",claro:"#EEF5DF",fundo:"#F5F8F1",borda:"#AFC19F"},
azul:{nome:"Azul",cor:"#2F6FA3",escuro:"#214E73",claro:"#E6F1F8",fundo:"#F4F8FB",borda:"#A9C7DA"},
amarela:{nome:"Amarela",cor:"#C49B00",escuro:"#705900",claro:"#FFF5C9",fundo:"#FFFDF3",borda:"#D8C77A"},
rosa:{nome:"Rosa",cor:"#C56A8A",escuro:"#74394D",claro:"#FCECF2",fundo:"#FFF8FA",borda:"#D9AFC0"},
roxa:{nome:"Roxa",cor:"#8064A2",escuro:"#503A6A",claro:"#F0EBF7",fundo:"#FAF8FC",borda:"#BFAED0"},
terracota:{nome:"Terracota",cor:"#B65C3A",escuro:"#693622",claro:"#F8E8E1",fundo:"#FCF7F4",borda:"#D5AA98"}
};

const avatares=["🌸","🌻","🌿","🦋","🐱","🐼","🐰","🦊","🐻","🐨","🐸","🦄"];

function aplicarTema(nome){
  const t=temas[nome]||temas.oliva;
  document.documentElement.style.setProperty("--verde",t.cor);
  document.documentElement.style.setProperty("--escuro",t.escuro);
  document.documentElement.style.setProperty("--claro",t.claro);
  document.documentElement.style.setProperty("--fundo",t.fundo);
  document.documentElement.style.setProperty("--borda",t.borda);
  localStorage.setItem("sinalMundoCor",nome);
}

aplicarTema(localStorage.getItem("sinalMundoCor")||"oliva");

function decoracao(){
  return '<div class="folha f1">🌿</div><div class="folha f2">🍃</div><div class="folha f3">🌿</div><div class="folha f4">🍃</div>';
}

function mostrarLogin(){
 document.getElementById("app").innerHTML=`
 <div class="tela"><div class="card">${decoracao()}<div class="conteudo">
 <img src="angela-vytorya-sinalmundo-1.jpg" alt="Foto" class="foto">
 <div style="font-size:40px;margin-bottom:5px">♡</div>
 <h1>Bem-vindo(a)!</h1>
 <p class="frase">Aqui, cada sinal é uma ponte para um mundo mais conectado!</p>
 <div class="divisor">♡</div>
 <div class="logo">🌎 SinalMundo</div>
 <p class="sublogo">Línguas de sinais aproximam pessoas ♡</p>
 <div class="divisor">─── ♡ ───</div>
 <p class="frase">Entre na sua conta para continuar.</p>
 <input id="loginEmail" type="email" placeholder="✉️  Seu e-mail">
 <input id="loginSenha" type="password" placeholder="🔒  Sua senha">
 <button id="entrarBtn" class="btn-verde">➜ &nbsp; Entrar</button>
 <button id="criarBtn" class="btn-claro">♧ &nbsp; Criar conta</button>
 <button id="esqueciBtn" class="btn-branco">🔒 &nbsp; Esqueci minha senha</button>
 <p id="loginMensagem" class="mensagem"></p>
 <div class="final">Juntos por um mundo<br>mais inclusivo! ♡</div>
 </div></div></div>`;
 document.getElementById("entrarBtn").onclick=fazerLogin;
 document.getElementById("criarBtn").onclick=mostrarCadastro;
 document.getElementById("esqueciBtn").onclick=mostrarRecuperacao;
}

async function fazerLogin(){
 const email=document.getElementById("loginEmail").value.trim();
 const senha=document.getElementById("loginSenha").value;
 const msg=document.getElementById("loginMensagem");
 if(!email||!senha){msg.innerText="Preencha seu e-mail e sua senha.";return}
 msg.innerText="Entrando... 💚";
 const {error}=await supabaseClient.auth.signInWithPassword({email,password:senha});
 if(error){msg.innerText="E-mail ou senha incorretos.";return}
 mostrarInicio();
}

function mostrarCadastro(){
 document.getElementById("app").innerHTML=`
 <div class="tela"><div class="card">${decoracao()}<div class="conteudo">
 <h1>Criar conta 💚</h1><p class="frase">Faça parte do SinalMundo! 🤟🏻</p>
 <input id="cadastroNome" type="text" placeholder="👤  Seu nome">
 <input id="cadastroEmail" type="email" placeholder="✉️  Seu e-mail">
 <input id="cadastroSenha" type="password" placeholder="🔒  Sua senha">
 <button id="confirmarCadastro" class="btn-verde">♡ &nbsp; Criar conta</button>
 <button id="voltarCadastro" class="btn-claro">← &nbsp; Voltar para entrar</button>
 <p id="cadastroMensagem" class="mensagem"></p>
 </div></div></div>`;
 document.getElementById("confirmarCadastro").onclick=criarConta;
 document.getElementById("voltarCadastro").onclick=mostrarLogin;
}

async function criarConta(){
 const nome=document.getElementById("cadastroNome").value.trim();
 const email=document.getElementById("cadastroEmail").value.trim();
 const senha=document.getElementById("cadastroSenha").value;
 const msg=document.getElementById("cadastroMensagem");
 if(!nome||!email||!senha){msg.innerText="Preencha todos os campos.";return}
 if(senha.length<6){msg.innerText="A senha precisa ter pelo menos 6 caracteres.";return}
 msg.innerText="Criando sua conta... 💚";
 const {data,error}=await supabaseClient.auth.signUp({email,password:senha,options:{data:{nome,avatar:"🌸",tema:"oliva",premium:false}}});
 if(error){msg.innerText="Não foi possível criar a conta.";return}
 if(data.session){mostrarInicio();return}
 msg.innerText="Conta criada! Verifique seu e-mail. 📧💚";
}

function mostrarRecuperacao(){
 document.getElementById("app").innerHTML=`
 <div class="tela"><div class="card">${decoracao()}<div class="conteudo">
 <h1>Recuperar senha 💚</h1><p class="frase">Digite seu e-mail para receber o link de recuperação. 📧</p>
 <input id="recuperarEmail" type="email" placeholder="✉️  Seu e-mail">
 <button id="enviarRecuperacao" class="btn-verde">🔒 &nbsp; Enviar link</button>
 <button id="voltarRecuperacao" class="btn-claro">← &nbsp; Voltar para entrar</button>
 <p id="recuperacaoMensagem" class="mensagem"></p>
 </div></div></div>`;
 document.getElementById("enviarRecuperacao").onclick=enviarRecuperacao;
 document.getElementById("voltarRecuperacao").onclick=mostrarLogin;
}

async function enviarRecuperacao(){
 const email=document.getElementById("recuperarEmail").value.trim();
 const msg=document.getElementById("recuperacaoMensagem");
 if(!email){msg.innerText="Digite seu e-mail.";return}
 msg.innerText="Enviando... 💚";
 const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin});
 if(error){msg.innerText="Não foi possível enviar o link.";return}
 msg.innerText="Link enviado! Verifique seu e-mail. 📧💚";
}

function mostrarInicio(){
 document.getElementById("app").innerHTML=`
 <div class="tela"><div class="card">${decoracao()}<div class="conteudo">
 <img src="angela-vytorya-sinalmundo-1.jpg" alt="Foto" class="foto">
 <div class="logo">🌎 SinalMundo</div><p class="sublogo">Línguas de sinais aproximam pessoas ♡</p>
 <div class="divisor">─── ♡ ───</div><h2>Seja bem-vindo(a)! 💚</h2>
 <p class="frase">Que bom ter você aqui! 🤟🏻</p>
 <div class="menu">
 <button id="pesquisaBtn" class="item">🔎 Pesquisar sinais</button>
 <button id="idiomasBtn" class="item">🌎 Línguas de sinais</button>
 <button id="favoritosBtn" class="item">♡ Meus favoritos</button>
 <button id="premiumBtn" class="item">👑 SinalMundo Premium</button>
 <button id="perfilBtn" class="item">👤 Meu perfil</button>
 <button id="sairBtn" class="btn-branco">🚪 Sair</button>
 </div>
 <div class="final">Juntos por um mundo<br>mais inclusivo! ♡</div>
 </div></div></div>`;
 document.getElementById("pesquisaBtn").onclick=mostrarPesquisa;
 document.getElementById("idiomasBtn").onclick=mostrarIdiomas;
 document.getElementById("favoritosBtn").onclick=mostrarFavoritos;
 document.getElementById("premiumBtn").onclick=mostrarPremium;
 document.getElementById("perfilBtn").onclick=mostrarPerfil;
 document.getElementById("sairBtn").onclick=sair;
}

function mostrarPesquisa(){
 document.getElementById("app").innerHTML=`
 <div class="tela"><div class="card">${decoracao()}<div class="conteudo">
 <h2>🔎 Pesquisar sinais</h2><p class="frase">Encontre um sinal para aprender. 🤟🏻</p>
 <input id="campoPesquisa" type="text" placeholder="🔎  Digite um sinal...">
 <button id="buscarSinal" class="btn-verde">🔎 &nbsp; Pesquisar</button>
 <div id="resultadoPesquisa" class="resultado">Digite uma palavra para pesquisar. 💚</div>
 <button id="voltarPesquisa" class="btn-claro">← &nbsp; Voltar</button>
 </div></div></div>`;
 document.getElementById("buscarSinal").onclick=pesquisar;
 document.getElementById("voltarPesquisa").onclick=mostrarInicio;
}

function pesquisar(){
 const palavra=document.getElementById("campoPesquisa").value.trim().toLowerCase();
 const resultado=document.getElementById("resultadoPesquisa");
 if(!palavra){resultado.innerText="Digite um sinal para pesquisar. 🔎";return}
 const encontrados=sinais.filter(s=>s.palavra.toLowerCase().includes(palavra));
 if(!encontrados.length){resultado.innerHTML="<strong>Nenhum sinal encontrado.</strong><br><br>Em breve vamos adicionar muitos sinais reais ao SinalMundo. 🤟🏻💚";return}
 resultado.innerHTML=encontrados.map(s=>`<div class="sinal"><strong>${s.palavra}</strong><br>${s.idioma}<br><br>${s.descricao}</div>`).join("");
}

function mostrarIdiomas(){
 document.getElementById("app").innerHTML=`
 <div class="tela"><div class="card">${decoracao()}<div class="conteudo">
 <h2>Línguas de sinais</h2><p class="frase">Explore diferentes línguas de sinais. 🤟🏻</p>
 <div class="lista">
 <div class="idioma"><strong>🇧🇷 Libras</strong><span>Língua Brasileira de Sinais</span></div>
 <div class="idioma"><strong>🇺🇸 ASL</strong><span>American Sign Language</span></div>
 <div class="idioma"><strong>🇬🇧 BSL</strong><span>British Sign Language</span></div>
 <div class="idioma"><strong>🌎 Outras línguas</strong><span>Mais línguas serão adicionadas.</span></div>
 </div><button id="voltarIdiomas" class="btn-claro">← &nbsp; Voltar</button>
 </div></div></div>`;
 document.getElementById("voltarIdiomas").onclick=mostrarInicio;
}

function mostrarFavoritos(){
 document.getElementById("app").innerHTML=`
 <div class="tela"><div class="card">${decoracao()}<div class="conteudo">
 <h2>♡ Meus favoritos</h2><p class="vazio">Seus sinais favoritos aparecerão aqui. 💚</p>
 <button id="voltarFavoritos" class="btn-claro">← &nbsp; Voltar</button>
 </div></div></div>`;
 document.getElementById("voltarFavoritos").onclick=mostrarInicio;
}

async function obterUsuario(){
 const {data}=await supabaseClient.auth.getUser();
 return data.user;
}

async function mostrarPremium(){
 const user=await obterUsuario();
 const premium=!!user?.user_metadata?.premium;
 document.getElementById("app").innerHTML=`
 <div class="tela"><div class="card">${decoracao()}<div class="conteudo">
 <h2>👑 SinalMundo Premium</h2>
 <p class="frase">Mais recursos para aprender línguas de sinais. 🤟🏻💚</p>
 <div class="premium">
 <h3>${premium?"Premium ativo 💚":"Plano Premium"}</h3>
 <ul>
 <li>🌎 Mais línguas de sinais</li>
 <li>🔎 Pesquisa completa</li>
 <li>♡ Favoritos</li>
 <li>🎥 Vídeos exclusivos</li>
 <li>🧠 Quizzes e desafios</li>
 <li>⚖️ Comparação entre línguas</li>
 <li>📚 Biblioteca completa</li>
 <li>💬 Grupo exclusivo Premium</li>
 <li>⭐ Novidades antecipadas</li>
 </ul>
 </div>
 <p class="pequeno">${premium?"Seu perfil está marcado como Premium.":"O pagamento/ativação do Premium será conectado depois."}</p>
 <button id="voltarPremium" class="btn-claro">← &nbsp; Voltar</button>
 </div></div></div>`;
 document.getElementById("voltarPremium").onclick=mostrarInicio;
}

async function salvarPerfil(dados){
 const {error}=await supabaseClient.auth.updateUser({data:dados});
 return !error;
}

async function mostrarPerfil(){
 const user=await obterUsuario();
 const meta=user?.user_metadata||{};
 const nome=meta.nome||"Usuário";
 const avatar=meta.avatar||"🌸";
 const tema=meta.tema||localStorage.getItem("sinalMundoCor")||"oliva";
 aplicarTema(tema);
 document.getElementById("app").innerHTML=`
 <div class="tela"><div class="card">${decoracao()}<div class="conteudo">
 <div style="font-size:70px">${avatar}</div>
 <h2>👤 Meu perfil</h2>
 <div class="resultado"><strong>${nome}</strong><br><br>${user?.email||""}</div>
 <h3 style="margin-top:20px">🎨 Escolha sua cor</h3>
 <div class="cor-grid">
 ${Object.keys(temas).map(k=>`<button class="cor cor-${k} ${tema===k?"selecionado":""}" data-cor="${k}" title="${temas[k].nome}">${temas[k].nome}</button>`).join("")}
 </div>
 <h3 style="margin-top:10px">😊 Escolha sua figurinha</h3>
 <div class="avatar-grid">
 ${avatares.map(a=>`<button class="avatar ${avatar===a?"selecionado":""}" data-avatar="${a}">${a}</button>`).join("")}
 </div>
 <p id="perfilMensagem" class="mensagem"></p>
 <button id="voltarPerfil" class="btn-claro">← &nbsp; Voltar</button>
 </div></div></div>`;
 document.querySelectorAll("[data-cor]").forEach(btn=>btn.onclick=async()=>{
   const nova=btn.dataset.cor; aplicarTema(nova);
   await salvarPerfil({tema:nova});
   mostrarPerfil();
 });
 document.querySelectorAll("[data-avatar]").forEach(btn=>btn.onclick=async()=>{
   const novo=btn.dataset.avatar; await salvarPerfil({avatar:novo}); mostrarPerfil();
 });
 document.getElementById("voltarPerfil").onclick=mostrarInicio;
}

async function sair(){
 await supabaseClient.auth.signOut();
 mostrarLogin();
}

async function verificarSessao(){
 const {data}=await supabaseClient.auth.getSession();
 if(data.session){mostrarInicio()}else{mostrarLogin()}
}

supabaseClient.auth.onAuthStateChange((event)=>{
 if(event==="SIGNED_OUT") mostrarLogin();
});

verificarSessao();
</script>
</body>
</html>
