*{

.card{
  width:100%;

  border-radius:32px;
  padding:30px 24px;
  text-align:center;
  box-shadow:0 12px 40px rgba(49,93,54,.12);

  overflow:hidden;
}

.card:before{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  left:-100px;
  top:120px;
  background:#E7F0D8;
  border-radius:50%;
  opacity:.7;
}

.card:after{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  right:-100px;
  bottom:20px;
  background:#E7F0D8;
  border-radius:50%;
  opacity:.7;
}

.conteudo{
  position:relative;
  z-index:2;
}

.foto{
  width:125px;
  height:125px;
  object-fit:cover;
  border-radius:50%;
  border:4px solid var(--verde);
  display:block;
  margin:0 auto 18px;

h1{

  color:var(--verde-escuro);

h2{

.frase{

.logo{

.sublogo{
  font-size:18px;
  margin-bottom:20px;
}

.divisor{

  font-size:24px;
  margin-bottom:15px;
}

input{

  padding:17px;
  margin-bottom:14px;
  border:2px solid var(--borda);
  border-radius:18px;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:var(--verde);
}

button{
  width:100%;
  padding:17px;
  margin-top:7px;
  border-radius:18px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.btn-verde{
  border:0;
  background:var(--verde);
  color:white;
}

.btn-claro{
  border:0;
  background:var(--verde-claro);
  color:var(--verde-escuro);
}

.btn-branco{
  background:white;
  color:var(--verde-escuro);

.mensagem{

  line-height:1.5;

.final{

  font-size:18px;
  line-height:1.5;

.folhas{
  font-size:30px;
  margin-bottom:12px;

.menu{

.item{
  padding:18px;
  border-radius:20px;
  background:var(--verde-claro);
  color:var(--verde-escuro);
  font-size:17px;
  font-weight:bold;

.resultado{

  line-height:1.5;

.lista{

.idioma{

    await supabaseClient.auth
      .signInWithPassword({

/* =========================
   FUNÇÃO CRIAR CONTA
========================= */

async function criarConta(){

  const nome =
    document.getElementById("cadastroNome")
      .value.trim();

  const email =
    document.getElementById("cadastroEmail")
      .value.trim();

  const senha =
    document.getElementById("cadastroSenha")
      .value;

  const mensagem =
    document.getElementById("cadastroMensagem");


  if(!nome || !email || !senha){

    mensagem.innerText =
      "Preencha todos os campos.";

    return;
  }


  if(senha.length < 6){

    mensagem.innerText =
      "A senha precisa ter pelo menos 6 caracteres.";

    return;
  }


  mensagem.innerText =
    "Criando sua conta... 💚";


  const { data, error } =
    await supabaseClient.auth
      .signUp({

        email:email,

        password:senha,

        options:{
          data:{
            nome:nome
          }
        }

      });


  if(error){

    mensagem.innerText =
      "Não foi possível criar a conta.";

    return;
  }


  if(data.session){

    mostrarInicio();

    return;
  }


  mensagem.innerText =
    "Conta criada! Verifique seu e-mail. 📧💚";

}

/* =========================

async function enviarRecuperacao(){

  const email =
    document.getElementById("recuperarEmail")
      .value.trim();

  const mensagem =
    document.getElementById("recuperacaoMensagem");


  if(!email){

    mensagem.innerText =
      "Digite seu e-mail.";

    return;
  }


  mensagem.innerText =
    "Enviando... 💚";


  const { error } =
    await supabaseClient.auth
      .resetPasswordForEmail(

        email,

        {
          redirectTo:
            window.location.origin
        }

      );


  if(error){

    mensagem.innerText =
      "Não foi possível enviar o link.";

    return;
  }


  mensagem.innerText =
    "Link enviado! Verifique seu e-mail. 📧💚";

}

/* =========================
   FUNÇÃO PESQUISAR
========================= */

function pesquisar(){

  const palavra =
    document.getElementById("campoPesquisa")
      .value.trim()
      .toLowerCase();

  const resultado =
    document.getElementById("resultadoPesquisa");


  if(!palavra){

    resultado.innerText =
      "Digite um sinal para pesquisar. 🔎";

    return;
  }


  const encontrados =
    sinais.filter(function(sinal){

      return sinal.palavra
        .toLowerCase()
        .includes(palavra);

    });


  if(encontrados.length === 0){

    resultado.innerHTML = `
      <strong>
        Nenhum sinal encontrado.
      </strong>

      <br><br>

      Em breve vamos adicionar
      muitos sinais reais ao SinalMundo. 🤟🏻💚
    `;

    return;
  }


  resultado.innerHTML =
    encontrados.map(function(sinal){

      return `
        <div class="sinal">

          <strong>
            ${sinal.palavra}
          </strong>

          <br>

          ${sinal.idioma}

          <br><br>

          ${sinal.descricao}

        </div>
      `;

    }).join("");

}

/* =========================
   VERIFICAR LOGIN
========================= */

async function verificarSessao(){

  const {
    data
  } =
    await supabaseClient.auth
      .getSession();


  if(data.session){

    mostrarInicio();

  }else{

    mostrarLogin();

  }

}

   INICIAR SINALMUNDO
========================= */

/* =========================
   OBSERVAR LOGIN E SAÍDA
========================= */

supabaseClient.auth.onAuthStateChange(
  function(event, session){

    if(event === "SIGNED_IN" && session){

      mostrarInicio();

    }

    if(event === "SIGNED_OUT"){

      mostrarLogin();

    }

  }
);
