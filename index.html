<!DOCTYPE html>

<style>
:root{--verde:#6B8E23;--verde-escuro:#315D36;--verde-claro:#EEF5DF;--fundo:#F5F8F1;--branco:#FFF;--cinza:#66757F;--borda:#AFC19F}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:var(--fundo);color:var(--verde-escuro)}
button,input{font-family:inherit}
#app{min-height:100vh}
.tela{min-height:100vh;padding:20px 14px;display:flex;justify-content:center;align-items:center}
.card{width:100%;max-width:500px;background:#fff;border-radius:32px;padding:30px 24px;text-align:center;box-shadow:0 12px 40px rgba(49,93,54,.12);position:relative;overflow:hidden}
.card:before,.card:after{content:"";position:absolute;width:180px;height:180px;background:#E7F0D8;border-radius:50%;opacity:.7}
.card:before{left:-100px;top:120px}
.card:after{right:-100px;bottom:20px}
.conteudo{position:relative;z-index:2}
.foto{width:125px;height:125px;object-fit:cover;border-radius:50%;border:4px solid var(--verde);display:block;margin:0 auto 18px}
h1{font-size:34px;color:var(--verde-escuro);margin-bottom:15px}
h2{font-size:27px;margin-bottom:15px}
.frase{font-size:18px;line-height:1.5;margin-bottom:22px}
.logo{font-size:38px;font-weight:bold;color:var(--verde);margin-bottom:8px}
.sublogo{font-size:18px;margin-bottom:20px}
.divisor{color:var(--verde);font-size:24px;margin-bottom:15px}
input{width:100%;padding:17px;margin-bottom:14px;border:2px solid var(--borda);border-radius:18px;font-size:16px;outline:none}
input:focus{border-color:var(--verde)}
button{width:100%;padding:17px;margin-top:7px;border-radius:18px;font-size:17px;font-weight:bold;cursor:pointer}
.btn-verde{border:0;background:var(--verde);color:#fff}
.btn-claro{border:0;background:var(--verde-claro);color:var(--verde-escuro)}
.btn-branco{background:#fff;color:var(--verde-escuro);border:2px solid var(--verde)}
.mensagem{margin-top:15px;font-size:16px;line-height:1.5}
.final{margin-top:28px;font-size:18px;line-height:1.5}
.menu{display:grid;gap:10px;margin-top:20px}
.item{padding:18px;border-radius:20px;background:var(--verde-claro);color:var(--verde-escuro);font-size:17px;font-weight:bold;border:0}
.resultado{margin-top:20px;padding:18px;border-radius:20px;background:var(--verde-claro);font-size:17px;line-height:1.5}
.lista{display:grid;gap:12px;margin-top:20px}
.idioma{padding:18px;background:var(--verde-claro);border:2px solid transparent;border-radius:20px;text-align:left}
.idioma strong{display:block;font-size:19px;margin-bottom:5px}
.idioma span{color:var(--cinza)}
.sinal{padding:18px;background:#fff;border:2px solid var(--borda);border-radius:20px;margin-top:12px}
.sinal strong{color:var(--verde);font-size:20px}
.vazio{margin-top:20px;color:var(--cinza);line-height:1.5}
.avatar-atual{font-size:80px;margin:15px 0}
.avatar-lista{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:15px}
.avatar-btn{width:60px;height:60px;padding:5px;margin:0;font-size:30px;background:var(--verde-claro);color:var(--verde-escuro);border:2px solid var(--borda);border-radius:18px}
.cores{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:15px}
.cor-btn{width:48px;height:48px;padding:0;margin:0;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--borda);font-size:0}
.premium-box{margin-top:18px;padding:22px;border:2px solid var(--borda);border-radius:24px;background:var(--verde-claro);text-align:left}
.premium-box h3{font-size:24px;color:var(--verde);margin-bottom:10px}
.premium-box p{line-height:1.5;margin-bottom:12px}
.premium-lista{padding-left:20px;line-height:1.8}
.pix{margin-top:15px;padding:15px;background:#fff;border-radius:16px;word-break:break-all;border:2px dashed var(--borda)}
.preco{font-size:28px;font-weight:bold;color:var(--verde);text-align:center;margin:12px 0}
.pequeno{font-size:14px;color:var(--cinza);margin-top:10px;line-height:1.4}
.aviso{margin-top:15px;padding:14px;border-radius:16px;background:#fff8df;color:#705d1b;font-size:14px;line-height:1.5}
</style>

function aplicarCor(cor,claro){
document.documentElement.style.setProperty("--verde",cor);
document.documentElement.style.setProperty("--verde-claro",claro);
localStorage.setItem("sinalMundoCor",cor);
localStorage.setItem("sinalMundoCorClaro",claro);
}

function carregarCor(){
const c=localStorage.getItem("sinalMundoCor");
const l=localStorage.getItem("sinalMundoCorClaro");
if(c&&l)aplicarCor(c,l);
}

async function criarConta(){
const nome=document.getElementById("cadastroNome").value.trim();
const email=document.getElementById("cadastroEmail").value.trim();
const senha=document.getElementById("cadastroSenha").value;
const m=document.getElementById("cadastroMensagem");

if(!nome||!email||!senha){
m.innerText="Preencha todos os campos.";
return;
}

if(senha.length<6){
m.innerText="A senha precisa ter pelo menos 6 caracteres.";
return;
}

m.innerText="Criando sua conta... 💚";

const{data,error}=await supabaseClient.auth.signUp({
email,
password:senha,
options:{data:{nome}}
});

if(error){
m.innerText="Não foi possível criar a conta.";
return;
}

if(data.session){
mostrarInicio();
return;
}

m.innerText="Conta criada! Verifique seu e-mail. 📧💚";
}

function pesquisar(){
const palavra=document.getElementById("campoPesquisa").value.trim().toLowerCase();
const r=document.getElementById("resultadoPesquisa");

if(!palavra){
r.innerText="Digite um sinal para pesquisar. 🔎";
return;
}

const e=sinais.filter(s=>s.palavra.toLowerCase().includes(palavra));

if(!e.length){
r.innerHTML="<strong>Nenhum sinal encontrado.</strong><br><br>Em breve vamos adicionar muitos sinais reais ao SinalMundo. 🤟🏻💚";
return;
}

r.innerHTML=e.map(s=>`
<div class="sinal">
<strong>${s.palavra}</strong><br>
${s.idioma}<br><br>
${s.descricao}
</div>
`).join("");
}

async function garantirPerfil(user){
let{data:perfil}=await supabaseClient
.from("perfis")
.select("avatar")
.eq("id",user.id)
.maybeSingle();

if(!perfil){
const{data:novo,error}=await supabaseClient
.from("perfis")
.insert({id:user.id,avatar:"😊"})
.select()
.single();

if(!error)perfil=novo;
}

return perfil;
}

async function mostrarPerfil(){
const{data}=await supabaseClient.auth.getUser();
const user=data.user;

if(!user){
mostrarLogin();
return;
}

const perfil=await garantirPerfil(user);
const avatar=perfil?.avatar||"😊";
const nome=user.user_metadata?.nome||"Usuário";

document.getElementById("app").innerHTML=`
<div class="tela">
<div class="card">
<div class="conteudo">

<h2>👤 Meu perfil</h2>

<div class="avatar-atual">${avatar}</div>

<div class="resultado">
<strong>${nome}</strong><br><br>
${user.email||""}
</div>

<p class="frase">Escolha sua figurinha 💚</p>

<div class="avatar-lista">
${avatares.map(a=>`
<button class="avatar-btn" onclick="salvarAvatar('${a}')">
${a}
</button>
`).join("")}
</div>

<p class="frase" style="margin-top:25px;margin-bottom:10px">
Escolha a cor do seu SinalMundo 🎨
</p>

<div class="cores">
${cores.map(c=>`
<button
class="cor-btn"
title="${c.nome}"
aria-label="${c.nome}"
style="background:${c.cor}"
onclick="salvarCor('${c.cor}','${c.claro}')">
</button>
`).join("")}
</div>

<p id="perfilMensagem" class="mensagem"></p>

<button id="voltarPerfil" class="btn-claro">
← Voltar
</button>

</div>
</div>
</div>`;

document.getElementById("voltarPerfil").onclick=mostrarInicio;
}

async function salvarAvatar(avatar){
const{data}=await supabaseClient.auth.getUser();
const user=data.user;

if(!user)return;

const{error}=await supabaseClient
.from("perfis")
.upsert(
{id:user.id,avatar},
{onConflict:"id"}
);

const m=document.getElementById("perfilMensagem");

if(error){
if(m)m.innerText="Não foi possível salvar a figurinha.";
return;
}

if(m)m.innerText="Figurinha salva! 💚";

setTimeout(mostrarPerfil,500);
}

function salvarCor(cor,claro){
aplicarCor(cor,claro);

const m=document.getElementById("perfilMensagem");

if(m)m.innerText="Cor salva neste aparelho! 💚";

setTimeout(mostrarPerfil,500);
}
